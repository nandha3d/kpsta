name: Build KPSTA Flutter Android APK

on:
  push:
    branches:
      - main
      - php8-codeigniter4-upgrade
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches:
      - main
      - php8-codeigniter4-upgrade
    paths:
      - 'mobile-app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile-app
        run: flutter test

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: mobile-app
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpsta-android-apk
          path: mobile-app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
